name: ci

# macOS only, and deliberately. The CMakeLists branches on APPLE and WIN32 and
# has no Linux path at all, so ubuntu is not an option; Windows needs GLEW from
# vcpkg, which is a slow, fragile thing to put in front of every pull request
# for a compile break that would almost certainly show up on macOS too. The
# release workflow still builds both.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 — the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. Passed as a single value with no
        # semicolon, which the shell would split.
        #
        # REGAUSS_BUILD_TOOLS is ON here where the release build turns it OFF:
        # rgtest is where the field model, the coil and the purity matrix are
        # actually checked, so compiling it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DREGAUSS_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # The three maths checks, which need no GPU beyond what the runner's
      # software GL can manage — rgtest falls back to a software pixel format
      # when there is no accelerated one, and --purity and --coil are pure CPU.
      #
      # NOT tools/verify.sh: the sweep renders several hundred frames per
      # parameter and the mask-gain check measures light through the real
      # shaders, both of which want a real GPU. Those stay local.
      - name: The field, against the C++ it mirrors
        run: ./build/rgtest --field

      - name: The purity model
        run: ./build/rgtest --purity

      - name: The degauss coil
        run: ./build/rgtest --coil

      # The browser demo's shaders are generated from source/shaders/ and
      # committed. This is what stops the committed copy drifting from the
      # plugin's own GLSL — the demo would go on looking like a demo of the
      # plugin while running something else.
      - name: The demo runs the plugin's shaders
        run: node demo/extract-shaders.mjs --check

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem — and a
      # bump to actions/upload-artifact otherwise touches release.yml alone,
      # a workflow no pull request ever runs. Using it here means the check
      # actually exercises the action being bumped.
      - uses: actions/upload-artifact@v7
        with:
          name: regauss-macos-arm64
          path: build/*.bundle
          if-no-files-found: error

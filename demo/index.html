  <body>
    <main id="demo">
      <noscript>
        <h1>(re)gauss</h1>
        <p>
          An FFGL effect that puts a magnet next to a CRT. The picture leans,
          every edge grows coloured fringes, and whole patches turn the wrong
          colour, all three from one magnetic field rather than three separate
          effects. A Degauss button fires the coil and clears it properly.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://stoatworks-labs.com/software/regauss/">its project page</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/regauss/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/regauss/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/regauss">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
